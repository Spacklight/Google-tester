<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OAuth Callback Test</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; max-width: 500px; word-break: break-all; }
        code { background: #334155; padding: 4px 8px; border-radius: 4px; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>OAuth Authorization Successful!</h1>
        <p>Authorizetion Code:</p>
        <code id="code-display">Extracting code...</code>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        document.getElementById('code-display').innerText = code || 'No authorization code found in URL.';
    </script>
</body>
</html>
